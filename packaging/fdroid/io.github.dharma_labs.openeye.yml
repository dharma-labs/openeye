    output: app/build/outputs/apk/release/app-release-unsigned.apk

MaintainerNotes: |
  Single module, `:app`. The release variant runs R8 with resource shrinking and is the variant
  that has been run on a device, so build that one rather than debug.

  The manifest declares no INTERNET permission at all, so the build must not gain one. If a future
  dependency pulls it in, that is a reason to stop and look rather than to add an anti-feature.

  `settings.gradle.kts` applies the foojay toolchain resolver, which only reaches the network if no
  local JDK 17 is found. The build images have one, so this stays a no-op there.
